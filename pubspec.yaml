name: diapason
description: A multi-source music player for Jellyfin, Plex, Subsonic/Navidrome and local files

publish_to: "none"
version: 0.11.0

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  background_downloader: ^9.5.9
  json_annotation: ^4.12.0
  chopper: ^8.7.1
  get_it: ^9.3.0
  # Vendored copy of just_audio 0.10.6 with Diapason's Darwin patches
  # (SpectrumTap FFT visualizer, 10-band equalizer, tvOS build, precise
  # FLAC seeking). See packages/README.md.
  just_audio:
    path: packages/just_audio
  just_audio_media_kit:
    git:
      url: https://github.com/Komodo5197/just_audio_media_kit.git
      ref: feat/queue-shuffle

  media_kit_libs_linux: ^1.2.1
  media_kit_libs_windows_audio:
    git:
      url: https://github.com/Komodo5197/media-kit.git
      ref: 9659892e095266beffeb71969db733afe9b6c424
      path: libs/windows/media_kit_libs_windows_audio
  smtc_windows:
    git:
      url: https://github.com/Komodo5197/frb_plugins.git
      ref: 7ece49cc16a459aaa0718ed23458802533daef37
      path: packages/smtc_windows/
  flutter_rust_bridge: 2.11.1

  audio_service: ^0.18.18
  audio_service_mpris: ^0.2.0
  audio_service_platform_interface: ^0.1.3
  audio_session: ^0.2.2
  rxdart: ^0.28.0
  simple_gesture_detector: ^0.2.1
  path_provider: ^2.0.14
  hive_ce: ^2.10.1
  hive_ce_flutter: ^2.2.0
  file_sizes: ^1.0.6
  logging: ^1.3.0
  collection: ^1.18.0
  clipboard: ^3.0.14
  archive: ^4.0.9
  file_picker: ^13.3.3
  file: ^7.0.1
  permission_handler: ^13.0.2
  provider: ^6.0.5
  uuid: ^4.5.1
  infinite_scroll_pagination: ^5.0.0
  flutter_sticky_header: ^0.11.0
  flutter_user_certificates_android:
    git:
      url: https://github.com/jfly/flutter_user_certificates_android.git
      ref: db81e4ff3222a7db1308ed03c4bc3142c0d271d5
  device_info_plus: ^13.3.0
  app_set_id: ^1.2.1
  package_info_plus: ^10.2.2
  octo_image: ^2.0.0
  split_view:
    git:
      url: https://github.com/odriverobotics/split_view.git
      ref: 8b2b0f0e1c8470183cb2df40815a05bfdb3fe219
  share_plus: ^13.3.1
  # Community-maintained continuation of isar 3 (same on-disk format). Its
  # generator supports current analyzers, which unblocks build_runner.
  isar_community: ^3.4.1
  isar_community_flutter_libs: ^3.4.1

  path: ^1.9.0
  path_provider_platform_interface: ^2.1.2
  intl:
  auto_size_text: ^3.0.0
  marquee: ^2.3.0
  palette_generator:
    git:
      url: https://github.com/jmshrv/packages.git
      ref: 4992c3b
      path: packages/palette_generator
  flutter_tabler_icons: ^1.43.0
  flutter_riverpod: ^3.0.0
  riverpod_annotation: ^4.0.3
  locale_names: ^1.1.1
  flutter_cache_manager: ^3.4.1
  balanced_text:
    git:
      url: https://github.com/Komodo5197/flutter-balanced-text.git
      ref: 8f3603a639be6a7d5b0008ec54b0e90df7cd8323
  flutter_to_airplay: ^2.0.5
  flutter_blurhash: ^0.9.1
  scroll_to_index: ^3.0.1
  window_manager: ^0.5.2
  url_launcher: ^6.3.1
  wakelock_plus: ^1.2.10
  battery_plus: ^7.0.0
  focus_on_it: ^2.0.1
  flutter_svg: ^2.0.17
  meta: ^1.15.0
  analyzer: ^12.1.0
  build: ^4.0.0
  source_gen: ^4.1.2
  web_socket_channel: ^3.0.2
  connectivity_plus: ^7.0.0
  progress_border: ^0.1.5
  visibility_detector: ^0.4.0+2
  gaimon: ^1.4.0
  http: ^1.4.0
  xml: ^7.0.0
  ffi: ^2.2.0
  yaml: ^3.1.3
  app_links: ^7.2.2
  flutter_discord_rpc: ^1.0.0
  shared_preferences: ^2.5.3
  # Android in-app updater: hands a downloaded APK to the system package
  # installer (sideload builds only; the store build never shows the updater).
  open_filex: ^5.0.0
  flex_color_picker: ^3.8.0
  dynamic_color: ^2.1.0
  dbus: ^0.7.11
  bits: ^1.4.0
  flutter_carplay:
    git:
      url: https://github.com/oguzhnatly/flutter_carplay.git
      ref: 017ce2e
  diacritic: ^0.1.6
  crypto: ^3.0.7
  audio_metadata_reader: ^1.6.0
  http_parser: ^4.1.2
  nsd: ^5.0.1
  flutter_chrome_cast: ^2.0.0
  home_widget: ^0.10.0

  # tvOS-only plugin forks: the tvOS implementations of the plugins above.
  # flutter build ignores them on every other platform; flutter-tvos picks them up for tvOS.
  flutter_tvos: ^1.1.3
  path_provider_tvos: any
  shared_preferences_tvos: any
  sqflite_tvos: any

  # These two carry native Android/iOS plugin code. As of Flutter 3.44, the
  # Gradle plugin loader excludes dev_dependency plugins from release builds,
  # but GeneratedPluginRegistrant.java still references them unconditionally,
  # which breaks release compilation (flutter/flutter#186800). Keeping them
  # as regular dependencies works around that until it's fixed upstream.
  integration_test:
    sdk: flutter
  flutter_native_splash: ^2.4.7
  aptabase_flutter: ^0.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.10.0
  flutter_gen_runner: ^5.15.0
  chopper_generator: ^8.7.1
  hive_ce_generator: ^1.11.2
  json_serializable: ^6.15.0
  flutter_launcher_icons: ^0.14.1
  flutter_lints: ^6.0.0
  riverpod_generator: ^4.0.4
  # riverpod_lint is left out until Flutter ships Dart 3.13: the release that
  # supports analyzer 14 (needed by hive_ce_generator) requires it.
  # Vendored: upstream reads @Name/@Enumerated/@Backlink only from the
  # synthetic field, so annotations on a getter/setter pair are dropped
  # (e.g. FinampUser.isarCurrentViewId would be renamed in the schema).
  isar_community_generator:
    path: packages/isar_community_generator
  msix: ^3.18.0

dependency_overrides:
  # The vendored just_audio also patches its platform interface (Darwin
  # equalizer request/response); just_audio_media_kit depends on the pub.dev
  # release, so force everything onto the vendored copy.
  just_audio_platform_interface:
    path: packages/just_audio_platform_interface

flutter:
  uses-material-design: true
  assets:
    - images/diapason.png
    - images/album_white.png
    - images/diapason_cropped.png
    - images/diapason_glyph.png
    - images/jellyfin-icon-transparent.png
    - assets/icon/icon_square_bg-black.png
    - assets/icon/icon_combined.png
    - assets/icon/icon_square_bg-white.png
    - assets/icon/icon_white_noborder.png
  generate: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon_combined.png"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  adaptive_icon_background: "#185AA0"
  remove_alpha_ios: true
  macos:
    generate: true
    image_path: "assets/icon/icon_combined_macos.png"

msix_config:
  display_name: Diapason
  publisher_display_name: Nytuo
  identity_name: fr.nytuo.diapason
  msix_version: 0.11.0.0
  logo_path: ./images/diapason_cropped.png
  trim_logo: false 
  capabilities: internetClient,musicLibrary,privateNetworkClientServer
  enable_at_startup: false
  certificate_path: ./windows/runner/resources/FINAMP_MSIX_LOCAL_CERTIFICATE_NEW.pfx
  certificate_password: finamp
  build_windows: false
  protocol_activation: diapason
