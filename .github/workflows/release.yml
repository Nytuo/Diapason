name: release

# Manual only.
#
#   1. version  — derive the next semver from the conventional commits since
#                 the last v* tag, or take the explicit override input.
#   2. build    — build every platform with that version patched into the
#                 manifests. The patch happens in the runner workspace only.
#   3. release  — a DRAFT GitHub release tagged v<version>, changelog as the
#                 body, artifacts attached.
#
# Mobile and TV targets: Android (phone + Android TV, one app bundle), iOS and
# tvOS. With "publish_stores" the Android bundle goes to Google Play (the
# Android TV form factor is enabled in the Play Console, see
# .github/MOBILE_RELEASE.md) and the iOS and tvOS builds go to App Store
# Connect. Store uploads never submit for review.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump — 'auto' derives it from conventional commits"
        type: choice
        default: auto
        options:
          - auto
          - patch
          - minor
          - major
      version:
        description: 'Explicit version, e.g. 1.4.0 (overrides "bump")'
        type: string
        required: false
      prerelease:
        description: 'Mark the release as a prerelease'
        type: boolean
        default: false
      run_integration_tests:
        description: 'Run the emulator integration tests'
        type: boolean
        default: false
      build_extras:
        description: 'Also build Snap and Flatpak'
        type: boolean
        default: false
      build_tvos:
        description: 'Build the tvOS app (needs the flutter-tvos toolchain)'
        type: boolean
        default: true
      publish_stores:
        description: 'Also upload to Google Play (phone + Android TV) and App Store Connect (iOS + tvOS)'
        type: boolean
        default: false
      play_track:
        description: 'Google Play track used when publishing'
        type: choice
        default: internal
        options:
          - internal
          - alpha
          - beta
          - production

env:
  if_condition: &integration_if inputs.run_integration_tests
  # flutter-tvos release tag: names the CLI version and the Flutter SDK it pins
  # (v<flutter>-tvos.<cli>). Bump deliberately; tvOS is outside stock Flutter.
  FLUTTER_TVOS_REF: v3.47.7-tvos.1.11.3

# Due to a flutter bug, flutter build is not generating localizations
# workaround by always running flutter pub get immediately before building,
# and performing build for msix:create manually to allow implementing this workaround
#
# Desktop builds are unsigned: they are for testing and for the auto-updater's
# release assets, not for store distribution.
jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.semver.outputs.version }}
      tag: ${{ steps.semver.outputs.tag }}
      previous_tag: ${{ steps.semver.outputs.previous_tag }}
      changelog: ${{ steps.semver.outputs.changelog }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute version and changelog
        id: semver
        shell: bash
        env:
          BUMP_INPUT: ${{ inputs.bump }}
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          set -euo pipefail

          D="$RUNNER_TEMP/changelog"
          mkdir -p "$D"

          # Baseline = the most recently created release tag, accepting every
          # scheme this repo has used (1.2.3, v1.2.3, app-v1.2.3) so a rename
          # never makes the next version go backwards.
          # New tags are always emitted as plain v<semver>.
          PREV=$(git tag --list --sort=-creatordate \
            | grep -E '^([A-Za-z][A-Za-z0-9_.-]*-)?v?[0-9]+\.[0-9]+\.[0-9]+$' \
            | head -n1 || true)
          if [ -n "$PREV" ]; then
            RANGE="${PREV}..HEAD"
            BASE=$(printf '%s' "$PREV" | sed -E 's/^([A-Za-z][A-Za-z0-9_.-]*-)?v?//')
          else
            RANGE=""
            BASE="0.0.0"
          fi
          IFS=. read -r MAJOR MINOR PATCH <<<"$BASE"
          MAJOR=${MAJOR:-0}; MINOR=${MINOR:-0}; PATCH=${PATCH:-0}

          if [ -n "$RANGE" ]; then
            git log --no-merges --format='%h%x1f%s%x1f%b%x1e' "$RANGE" > "$D/commits"
          else
            git log --no-merges --format='%h%x1f%s%x1f%b%x1e' > "$D/commits"
          fi

          HAS_FEAT=0; HAS_BREAKING=0; COUNT=0
          while IFS=$'\x1f' read -r -d $'\x1e' SHA SUBJECT BODY; do
            SHA="${SHA#$'\n'}"
            [ -z "$SHA" ] && continue
            COUNT=$((COUNT + 1))

            if [[ "$SUBJECT" =~ ^([a-zA-Z]+)(\(([^\)]*)\))?(!)?:[[:space:]]*(.*)$ ]]; then
              TYPE=$(printf '%s' "${BASH_REMATCH[1]}" | tr '[:upper:]' '[:lower:]')
              SCOPE="${BASH_REMATCH[3]}"
              BANG="${BASH_REMATCH[4]}"
              DESC="${BASH_REMATCH[5]}"
            else
              TYPE="other"; SCOPE=""; BANG=""; DESC="$SUBJECT"
            fi

            IS_BREAKING=0
            [ -n "$BANG" ] && IS_BREAKING=1
            if printf '%s' "$BODY" | grep -qE '^BREAKING[ -]CHANGE'; then
              IS_BREAKING=1
            fi

            if [ -n "$SCOPE" ]; then
              ENTRY="- **${SCOPE}:** ${DESC} (${SHA})"
            else
              ENTRY="- ${DESC} (${SHA})"
            fi

            case "$TYPE" in
              feat|feature) HAS_FEAT=1; echo "$ENTRY" >> "$D/feat" ;;
              fix|bugfix)   echo "$ENTRY" >> "$D/fix" ;;
              perf)         echo "$ENTRY" >> "$D/perf" ;;
              refactor)     echo "$ENTRY" >> "$D/refactor" ;;
              docs)         echo "$ENTRY" >> "$D/docs" ;;
              *)            echo "$ENTRY" >> "$D/misc" ;;
            esac
            [ "$IS_BREAKING" = 1 ] && echo "$ENTRY" >> "$D/breaking"
          done < "$D/commits"

          if [ -n "$VERSION_INPUT" ]; then
            VERSION="${VERSION_INPUT#v}"
            if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+].*)?$ ]]; then
              echo "::error::'$VERSION_INPUT' is not a valid semver version (expected e.g. 1.4.0)"
              exit 1
            fi
          else
            if [ "$COUNT" -eq 0 ]; then
              echo "::error::No commits since ${PREV:-the start of history} — nothing to release."
              exit 1
            fi
            BUMP="$BUMP_INPUT"
            if [ "$BUMP" = "auto" ]; then
              if   [ "$HAS_BREAKING" = 1 ]; then BUMP="major"
              elif [ "$HAS_FEAT" = 1 ];     then BUMP="minor"
              else                               BUMP="patch"
              fi
            fi
            case "$BUMP" in
              major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
              minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
              patch) PATCH=$((PATCH + 1)) ;;
            esac
            VERSION="${MAJOR}.${MINOR}.${PATCH}"
          fi

          TAG="v${VERSION}"
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "::error::Tag ${TAG} already exists. Pass an explicit 'version' input to pick another."
            exit 1
          fi

          {
            if [ -s "$D/breaking" ]; then echo "### ⚠ BREAKING CHANGES"; echo; cat "$D/breaking"; echo; fi
            if [ -s "$D/feat" ];     then echo "### Features";           echo; cat "$D/feat";     echo; fi
            if [ -s "$D/fix" ];      then echo "### Bug Fixes";          echo; cat "$D/fix";      echo; fi
            if [ -s "$D/perf" ];     then echo "### Performance";        echo; cat "$D/perf";     echo; fi
            if [ -s "$D/refactor" ]; then echo "### Refactoring";        echo; cat "$D/refactor"; echo; fi
            if [ -s "$D/docs" ];     then echo "### Documentation";      echo; cat "$D/docs";     echo; fi
            if [ -s "$D/misc" ];     then echo "### Other";              echo; cat "$D/misc";     echo; fi
            if [ -n "$PREV" ]; then
              echo "**Full changelog**: https://github.com/${GITHUB_REPOSITORY}/compare/${PREV}...${TAG}"
            else
              echo "**Full changelog**: https://github.com/${GITHUB_REPOSITORY}/commits/${TAG}"
            fi
          } > "$D/changelog.md"

          {
            echo "version=${VERSION}"
            echo "tag=${TAG}"
            echo "previous_tag=${PREV}"
            echo "changelog<<__CHANGELOG_EOF__"
            cat "$D/changelog.md"
            echo "__CHANGELOG_EOF__"
          } >> "$GITHUB_OUTPUT"

          {
            echo "## ${TAG}"
            echo
            echo "Previous tag: \`${PREV:-none}\` · commits analysed: ${COUNT}"
            echo
            cat "$D/changelog.md"
          } >> "$GITHUB_STEP_SUMMARY"

  mobile-plan:
    name: Plan store uploads
    runs-on: ubuntu-latest
    outputs:
      publish_android: ${{ steps.plan.outputs.publish_android }}
      publish_ios: ${{ steps.plan.outputs.publish_ios }}
      publish_tvos: ${{ steps.plan.outputs.publish_tvos }}
    steps:
      - name: Check store secrets
        id: plan
        shell: bash
        env:
          PUBLISH: ${{ inputs.publish_stores }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_DISTRIBUTION_CERT_P12_BASE64: ${{ secrets.APPLE_DISTRIBUTION_CERT_P12_BASE64 }}
          APPLE_DISTRIBUTION_CERT_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_CERT_PASSWORD }}
          BUILD_TVOS: ${{ inputs.build_tvos }}
        run: |
          set -euo pipefail

          if [ "$PUBLISH" != "true" ]; then
            {
              echo "publish_android=false"
              echo "publish_ios=false"
              echo "publish_tvos=false"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          missing() {
            local out=() name
            for name in "$@"; do
              [ -n "${!name:-}" ] || out+=("$name")
            done
            echo "${out[*]:-}"
          }

          # The keystore password is optional: a keystore may have none, and GitHub cannot store an empty secret.
          ANDROID_GONE=$(missing ANDROID_KEYSTORE_BASE64 ANDROID_KEY_ALIAS PLAY_SERVICE_ACCOUNT_JSON)
          IOS_GONE=$(missing APPLE_API_ISSUER APPLE_API_KEY APPLE_API_KEY_P8 APPLE_DISTRIBUTION_CERT_P12_BASE64 APPLE_DISTRIBUTION_CERT_PASSWORD)
          TVOS_GONE=$(missing APPLE_API_ISSUER APPLE_API_KEY APPLE_API_KEY_P8 APPLE_DISTRIBUTION_CERT_P12_BASE64 APPLE_DISTRIBUTION_CERT_PASSWORD)
          [ "$BUILD_TVOS" = "true" ] || TVOS_GONE="tvOS build disabled"

          [ -n "$ANDROID_GONE" ] && echo "::warning::Google Play upload skipped, missing secrets: ${ANDROID_GONE}"
          [ -n "$IOS_GONE" ] && echo "::warning::App Store Connect upload (iOS) skipped, missing secrets: ${IOS_GONE}"
          [ -n "$TVOS_GONE" ] && echo "::warning::App Store Connect upload (tvOS) skipped: ${TVOS_GONE}"

          if [ -n "$ANDROID_GONE" ] && [ -n "$IOS_GONE" ] && [ -n "$TVOS_GONE" ]; then
            echo "::error::publish_stores is ticked but no store secrets are configured for any platform."
            exit 1
          fi

          {
            echo "publish_android=$([ -z "$ANDROID_GONE" ] && echo true || echo false)"
            echo "publish_ios=$([ -z "$IOS_GONE" ] && echo true || echo false)"
            echo "publish_tvos=$([ -z "$TVOS_GONE" ] && echo true || echo false)"
          } >> "$GITHUB_OUTPUT"

  build-android:
    needs: version
    name: Build for Android
    runs-on: ubuntu-latest
    steps:
    - name: Clone repository
      uses: actions/checkout@v6

    - uses: actions/setup-java@v5
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Apply release version
      id: version
      env:
        VERSION: ${{ needs.version.outputs.version }}
      run: |
        set -eu
        NEW="$VERSION+${GITHUB_RUN_NUMBER}"
        perl -pi -e "s/^version:.*/version: $NEW/" pubspec.yaml
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"

    - name: Check Android TV manifest requirements
      run: |
        set -eu
        M=android/app/src/main/AndroidManifest.xml
        need() { grep -q "$1" "$M" || { echo "::error::$M is missing: $2"; exit 1; }; }
        need 'android.intent.category.LEANBACK_LAUNCHER' 'a LEANBACK_LAUNCHER activity (TV home screen entry)'
        need 'android:banner=' 'android:banner (the TV launcher banner)'
        need 'android.software.leanback' 'the leanback <uses-feature> (required="false" so phones still install it)'
        need 'android.hardware.touchscreen' 'a touchscreen <uses-feature> with required="false" (TVs have none)'
        grep -A1 'android.hardware.touchscreen' "$M" | grep -q 'required="false"' || { echo "::error::touchscreen must be required=false"; exit 1; }
        ls android/app/src/main/res/drawable*/tv_banner.* >/dev/null 2>&1 || { echo "::error::tv_banner drawable not found"; exit 1; }
        echo "Android TV manifest requirements are met."

    - name: Configure release signing
      id: signing
      shell: bash
      env:
        ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      run: |
        set -euo pipefail
        if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
          # The password secrets are optional (a keystore can have no password, and GitHub cannot store an
          # empty secret); the alias is not.
          if [ -z "$ANDROID_KEY_ALIAS" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is set, ANDROID_KEY_ALIAS must be too."
            exit 1
          fi
          umask 077
          KEYSTORE="$RUNNER_TEMP/upload-keystore.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$KEYSTORE"
          {
            echo "storeFile=$KEYSTORE"
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "keyPassword=${ANDROID_KEY_PASSWORD:-$ANDROID_KEYSTORE_PASSWORD}"
          } > android/key.properties
          echo "real_key=true" >> "$GITHUB_OUTPUT"
        else
          echo "::warning::No ANDROID_KEYSTORE_BASE64 secret: signing with the debug keystore. The AAB will not be uploaded, this build cannot go to Google Play."
          echo "real_key=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Free up disk space
      run: |
        # Remove .NET SDKs
        sudo rm -rf /usr/share/dotnet
        # Remove Swift toolchain
        sudo rm -rf /usr/share/swift
        # Remove Haskell (GHC)
        sudo rm -rf /usr/local/.ghcup
        # Remove Julia
        sudo rm -rf /usr/local/julia*
        # Remove PowerShell
        sudo rm -rf /usr/local/share/powershell
        df -h

    # Use the same flutter setup as the linux build to allow sharing the pub cache and it utilizing the same cache key
    - name: Determine Flutter stable version
      uses: subosito/flutter-action@v2
      id: flutter-version
      with:
        architecture: 'x64'
        channel: 'stable'
        dry-run: true
    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        # Prebuilt ARM linux builds are not provided, so build flutter from source
        channel: master
        flutter-version: "${{ steps.flutter-version.outputs.VERSION }}"
        cache: false
        pub-cache: true
        # Include arch as linux aarch64 include isar overriding
        # arch can be removed later once isar aarch64 is easily available on pub.dev and overriding is not needed anymore
        pub-cache-key: "flutter-pub-:os:-:channel:-:version:-:arch:-:hash:"


    - name: Gradle cache
      uses: actions/cache@v5
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        # If exact match is not found, fallback to OS match
        restore-keys: ${{ runner.os }}-gradle-

    - name: Cache Dart build cache
      uses: actions/cache@v5
      with:
        path: |
          .dart_tool
          build
        key: ${{ runner.os }}-android-dart-build-${{ hashFiles('pubspec.lock') }}
        restore-keys: ${{ runner.os }}-android-dart-build-

    - run: flutter doctor
    - run: flutter pub get

    - run: flutter build apk --release --no-pub

    # A single universal APK, so no arch token in the name.
    - name: Rename APK
      run: cp build/app/outputs/flutter-apk/app-release.apk "diapason-${{ steps.version.outputs.version }}_android.apk"

    - uses: actions/upload-artifact@v6
      with:
        name: diapason-android
        path: diapason-${{ steps.version.outputs.version }}_android.apk
        compression-level: 0 # no compression

    # Android TV: the same app, built for the ABIs TVs actually use (no x86),
    # which makes it a good deal smaller for sideloading with adb or Downloader.
    # Google Play does not need this file: the single bundle below covers TV.
    - name: Build Android TV APK
      run: |
        flutter build apk --release --no-pub --target-platform android-arm,android-arm64
        cp build/app/outputs/flutter-apk/app-release.apk "diapason-${{ steps.version.outputs.version }}_androidtv.apk"

    - uses: actions/upload-artifact@v6
      with:
        name: diapason-androidtv
        path: diapason-${{ steps.version.outputs.version }}_androidtv.apk
        compression-level: 0

    - run: flutter build appbundle --release --no-pub

    - name: Rename AAB
      if: steps.signing.outputs.real_key == 'true'
      run: cp build/app/outputs/bundle/release/app-release.aab "diapason-${{ steps.version.outputs.version }}_android.aab"

    # Kept out of the GitHub release (not directly installable); only the
    # google-play job below consumes it.
    - uses: actions/upload-artifact@v6
      if: steps.signing.outputs.real_key == 'true'
      with:
        name: store-android-aab
        path: diapason-${{ steps.version.outputs.version }}_android.aab
        retention-days: 14
        compression-level: 0

    - name: Enable KVM group perms
      if: *integration_if
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm

    - name: Run Integration tests on api 36
      if: *integration_if
      timeout-minutes: 20
      # android emulator is flaky so we retry once
      uses: Wandalen/wretry.action@v3.8.0
      with:
        action: reactivecircus/android-emulator-runner@v2
        # Use the newest supported version of android
        with: |
          api-level: 36
          arch: x86_64
          profile: pixel
          disk-size: 5120M
          script: |
            adb logcat -c
            adb logcat &
            timeout 13m flutter test integration_test/test_cases.dart -d emulator

    - name: Run Integration tests on api 25
      if: *integration_if
      timeout-minutes: 20
      # android emulator is flaky so we retry once
      uses: Wandalen/wretry.action@v3.8.0
      with:
        action: reactivecircus/android-emulator-runner@v2
        # We can't use the oldest supported version api 24 because it doesn't recognize the certificates
        # used by the demo server, so we use the second-oldest api 25.
        with: |
          api-level: 25
          arch: x86_64
          profile: pixel
          disk-size: 5120M
          script: |
            adb logcat -c
            adb logcat &
            timeout 13m flutter test integration_test/test_cases.dart -d emulator

  build-ios:
    needs: version
    name: Build for iOS
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v6

    - uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'
        cache: false
        pub-cache: true

    # Stamps the dispatched version into pubspec.yaml so the built binaries and
    # the asset filenames below agree with the release tag. Workspace only —
    # never committed back to the repo.
    - name: Apply release version
      id: version
      env:
        VERSION: ${{ needs.version.outputs.version }}
      run: |
        set -eu
        # The store build number (Android versionCode, iOS/tvOS CFBundleVersion)
        # has to grow with every upload or the stores refuse it, even for a new
        # version string. The run number only ever goes up.
        NEW="$VERSION+${GITHUB_RUN_NUMBER}"
        perl -pi -e "s/^version:.*/version: $NEW/" pubspec.yaml
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"

    - name: Cache CocoaPods
      uses: actions/cache@v5
      with:
        path: |
          ios/Pods
          ~/.cocoapods
        key: ${{ runner.os }}-pods-${{ hashFiles('ios/Podfile.lock') }}
        restore-keys: ${{ runner.os }}-pods-

    - name: Cache Dart build cache
      uses: actions/cache@v5
      with:
        path: |
          .dart_tool
          build
        key: ${{ runner.os }}-dart-build-${{ hashFiles('pubspec.lock') }}
        restore-keys: ${{ runner.os }}-dart-build-

    - run: flutter doctor
    - run: flutter pub get

    - run: flutter build ios --release --no-pub --no-codesign

    # No signing identity here (--no-codesign), so this is an unsigned IPA:
    # useful as a release artifact / for resigning, not for direct install.
    # An IPA is just a zip of a Payload/ dir containing the .app.
    - name: Package IPA
      run: |
        mkdir -p build/ios/ipa/Payload
        cp -r build/ios/iphoneos/Runner.app build/ios/ipa/Payload/Diapason.app
        (cd build/ios/ipa && zip -qr "$GITHUB_WORKSPACE/diapason-${{ steps.version.outputs.version }}_ios.ipa" Payload)

    - uses: actions/upload-artifact@v6
      with:
        name: diapason-ios
        path: diapason-${{ steps.version.outputs.version }}_ios.ipa
        compression-level: 0 # already compressed

    - name: Check App Store Connect credentials
      id: apple
      env:
        APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        CERT: ${{ secrets.APPLE_DISTRIBUTION_CERT_P12_BASE64 }}
        CERT_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_CERT_PASSWORD }}
      run: |
        if [ -n "$APPLE_API_ISSUER" ] && [ -n "$APPLE_API_KEY" ] && [ -n "$APPLE_API_KEY_P8" ] && [ -n "$CERT" ] && [ -n "$CERT_PASSWORD" ]; then
          echo "present=true" >> "$GITHUB_OUTPUT"
        else
        echo "::notice::No App Store Connect API key or Distribution certificate: building the unsigned IPA only."
        echo "present=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Import Apple Distribution certificate
      if: steps.apple.outputs.present == 'true'
      env:
        CERT: ${{ secrets.APPLE_DISTRIBUTION_CERT_P12_BASE64 }}
        CERT_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_CERT_PASSWORD }}
      run: |
        set -euo pipefail
        KEYCHAIN="$RUNNER_TEMP/ios-signing.keychain-db"
        KEYCHAIN_PASSWORD=$(uuidgen)
        printf '%s' "$CERT" | base64 -d > "$RUNNER_TEMP/dist.p12"
        security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
        security set-keychain-settings -lut 21600 "$KEYCHAIN"
        security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
        security import "$RUNNER_TEMP/dist.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
        security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
        EXISTING=$(security list-keychains -d user | tr -d '"')
        # shellcheck disable=SC2086
        security list-keychains -d user -s "$KEYCHAIN" $EXISTING
        rm -f "$RUNNER_TEMP/dist.p12"
        security find-identity -v -p codesigning "$KEYCHAIN" | grep "Apple Distribution"

    - name: Build and export signed IPA (App Store Connect)
      id: appstore_ipa
      if: steps.apple.outputs.present == 'true'
      working-directory: ios
      env:
        APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
      run: |
        set -euo pipefail
        KEY_DIR="$HOME/.appstoreconnect/private_keys"
        mkdir -p "$KEY_DIR"
        printf '%s\n' "$APPLE_API_KEY_P8" > "$KEY_DIR/AuthKey_${APPLE_API_KEY}.p8"

        # Archive without signing. Prevents Xcode from contacting Apple to issue dev certificates.
        xcodebuild -workspace Runner.xcworkspace -scheme Runner -sdk iphoneos \
          -configuration Release -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
          archive CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

        cat > "$RUNNER_TEMP/ExportOptions.plist" <<'PLIST'
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
          <key>method</key>
          <string>app-store-connect</string>
          <key>signingStyle</key>
          <string>automatic</string>
          <key>teamID</key>
          <string>U5WGLFU24B</string>
        </dict>
        </plist>
        PLIST

        # Xcode uses the Distribution certificate already in the keychain and fetches/creates the App Store profile
        xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
          -exportPath "$RUNNER_TEMP/export" -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
          -allowProvisioningUpdates \
          -authenticationKeyPath "$KEY_DIR/AuthKey_${APPLE_API_KEY}.p8" \
          -authenticationKeyID "$APPLE_API_KEY" \
          -authenticationKeyIssuerID "$APPLE_API_ISSUER"

        mkdir -p "$GITHUB_WORKSPACE/dist/store"
        cp "$RUNNER_TEMP"/export/*.ipa "$GITHUB_WORKSPACE/dist/store/diapason-${{ steps.version.outputs.version }}_ios-store.ipa"

    - uses: actions/upload-artifact@v6
      if: steps.appstore_ipa.outcome == 'success'
      with:
        name: store-ios-ipa
        path: dist/store/*.ipa
        retention-days: 14
        compression-level: 0

    # `model` is matched as a literal device name, not a regex, and both it and
    # os_version shift with the runner image. Constrain to iOS only and let the
    # action pick whatever device is actually installed.
    - name: Start simulator
      id: simulator
      if: *integration_if
      uses: futureware-tech/simulator-action@v5
      with:
        os: 'iOS'
        wait_for_boot: true
        erase_before_boot: true
        boot_timeout_seconds: 360

    - name: Run Integration Tests
      if: *integration_if
      run: flutter test integration_test/test_cases.dart -d ${{ steps.simulator.outputs.udid }}

  build-tvos:
    needs: version
    name: Build for tvOS
    if: ${{ inputs.build_tvos }}
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v6

    - uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable

    # Same store-safe build number as Android and iOS (see build-android).
    - name: Apply release version
      id: version
      env:
        VERSION: ${{ needs.version.outputs.version }}
      run: |
        set -eu
        NEW="$VERSION+${GITHUB_RUN_NUMBER}"
        perl -pi -e "s/^version:.*/version: $NEW/" pubspec.yaml
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"

    # tvOS is outside stock Flutter: flutter-tvos is a CLI that pins its own
    # Flutter SDK plus a prebuilt tvOS engine. The tag in FLUTTER_TVOS_REF
    # names both, so the toolchain is reproducible.
    - name: Install flutter-tvos
      run: |
        set -eux
        git clone --depth 1 --branch "$FLUTTER_TVOS_REF" https://github.com/fluttertv/flutter-tvos.git "$RUNNER_TEMP/flutter-tvos"
        echo "$RUNNER_TEMP/flutter-tvos/bin" >> "$GITHUB_PATH"

    - name: Cache pub packages and CocoaPods
      uses: actions/cache@v5
      with:
        path: |
          ~/.pub-cache
          tvos/Pods
          ~/.cocoapods
        key: ${{ runner.os }}-tvos-${{ env.FLUTTER_TVOS_REF }}-${{ hashFiles('pubspec.lock', 'tvos/Podfile.lock') }}
        restore-keys: ${{ runner.os }}-tvos-${{ env.FLUTTER_TVOS_REF }}-

    - run: flutter-tvos precache
    - run: flutter-tvos doctor -v

    # flutter-tvos reads the tvOS plugins itself and wires them into the Xcode project (Swift Package Manager for
    # the ones that ship a Package.swift, CocoaPods for the rest), so there is nothing to restore by hand.
    - name: Fetch packages
      run: flutter-tvos pub get

    # Xcode ships the tvOS SDK but the platform (device support) is a separate
    # download on some runner images; building without it fails with "tvOS is
    # not installed".
    - name: Make sure the tvOS platform is installed
      run: |
        set -u
        if xcodebuild -workspace tvos/Runner.xcworkspace -scheme Runner -showdestinations 2>&1 | grep -q 'tvOS .* is not installed'; then
          echo "Downloading the tvOS platform…"
          xcodebuild -downloadPlatform tvOS
        else
          echo "tvOS platform already installed."
        fi

    # One command builds the Dart side and the Xcode app, unsigned. It also yields the IPA for the GitHub release.
    - name: Build the tvOS app (unsigned) and package an IPA
      run: |
        set -euxo pipefail
        flutter-tvos build tvos --release --no-codesign
        APP=build/tvos/Release-appletvos/Runner.app
        test -d "$APP" || { echo "::error::No tvOS .app was produced at $APP"; exit 1; }
        rm -rf ipa && mkdir -p ipa/Payload
        cp -R "$APP" ipa/Payload/Diapason.app
        (cd ipa && zip -qr "$GITHUB_WORKSPACE/diapason-${{ steps.version.outputs.version }}_tvos.ipa" Payload)

    - uses: actions/upload-artifact@v6
      with:
        name: diapason-tvos
        path: diapason-${{ steps.version.outputs.version }}_tvos.ipa
        compression-level: 0

    # `secrets` cannot be used in a step `if`, so check them in a step.
    # Store builds need the API key (provisioning) AND an Apple Distribution
    # certificate: flutter-tvos signs the engine with it, and Apple rejects an
    # unsigned engine at external TestFlight review (ITMS-91065).
    - name: Check App Store Connect credentials
      id: apple
      env:
        APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        CERT: ${{ secrets.APPLE_DISTRIBUTION_CERT_P12_BASE64 }}
        CERT_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_CERT_PASSWORD }}
      run: |
        if [ -n "$APPLE_API_ISSUER" ] && [ -n "$APPLE_API_KEY" ] && [ -n "$APPLE_API_KEY_P8" ] && [ -n "$CERT" ] && [ -n "$CERT_PASSWORD" ]; then
          echo "present=true" >> "$GITHUB_OUTPUT"
        else
          echo "::notice::tvOS store build skipped: needs APPLE_API_* and APPLE_DISTRIBUTION_CERT_* secrets. The unsigned IPA is still released."
          echo "present=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Import the Apple Distribution certificate
      if: steps.apple.outputs.present == 'true'
      env:
        CERT: ${{ secrets.APPLE_DISTRIBUTION_CERT_P12_BASE64 }}
        CERT_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_CERT_PASSWORD }}
      run: |
        set -euo pipefail
        KEYCHAIN="$RUNNER_TEMP/tvos-signing.keychain-db"
        KEYCHAIN_PASSWORD=$(uuidgen)
        printf '%s' "$CERT" | base64 -d > "$RUNNER_TEMP/dist.p12"
        security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
        security set-keychain-settings -lut 21600 "$KEYCHAIN"
        security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
        security import "$RUNNER_TEMP/dist.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
        security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
        EXISTING=$(security list-keychains -d user | tr -d '"')
        # shellcheck disable=SC2086 # the existing keychain list is intentionally word-split
        security list-keychains -d user -s "$KEYCHAIN" $EXISTING
        rm -f "$RUNNER_TEMP/dist.p12"
        security find-identity -v -p codesigning "$KEYCHAIN" | grep "Apple Distribution"

    - name: Build, archive and export signed IPA (App Store Connect)
      id: appstore_ipa
      if: steps.apple.outputs.present == 'true'
      env:
        APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
      run: |
        set -euo pipefail
        KEY_DIR="$HOME/.appstoreconnect/private_keys"
        mkdir -p "$KEY_DIR"
        printf '%s\n' "$APPLE_API_KEY_P8" > "$KEY_DIR/AuthKey_${APPLE_API_KEY}.p8"

        # flutter-tvos forwards these to xcodebuild so it can fetch the
        # provisioning profile on a machine with no signed-in Xcode account.
        export APP_STORE_CONNECT_KEY_PATH="$KEY_DIR/AuthKey_${APPLE_API_KEY}.p8"
        export APP_STORE_CONNECT_KEY_ID="$APPLE_API_KEY"
        export APP_STORE_CONNECT_ISSUER_ID="$APPLE_API_ISSUER"

        # Stage the Dart build and the frameworks the archive embeds. flutter-tvos signs the engine with the
        # Apple Distribution certificate in the keychain (Apple's ITMS-91065 check wants that signature on the
        # engine itself), but the app is not signed here: a "Release" build signs with a development identity, and
        # a development provisioning profile cannot be made on a team that has no registered devices.
        flutter-tvos build tvos --release --no-codesign

        # Archive without signing, then let the export sign it for the App Store: with automatic signing and the
        # API key, Xcode makes the distribution profile (no devices needed) and signs with the certificate.
        cd tvos
        xcodebuild -workspace Runner.xcworkspace -scheme Runner -destination 'generic/platform=tvOS' \
          -configuration Release -archivePath "$RUNNER_TEMP/RunnerTV.xcarchive" \
          archive CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

        cat > "$RUNNER_TEMP/ExportOptionsTV.plist" <<'PLIST'
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
          <key>method</key>
          <string>app-store-connect</string>
          <key>signingStyle</key>
          <string>automatic</string>
          <key>teamID</key>
          <string>U5WGLFU24B</string>
        </dict>
        </plist>
        PLIST

        xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/RunnerTV.xcarchive" \
          -exportPath "$RUNNER_TEMP/export-tv" -exportOptionsPlist "$RUNNER_TEMP/ExportOptionsTV.plist" \
          -allowProvisioningUpdates \
          -authenticationKeyPath "$APP_STORE_CONNECT_KEY_PATH" \
          -authenticationKeyID "$APPLE_API_KEY" \
          -authenticationKeyIssuerID "$APPLE_API_ISSUER"

        mkdir -p "$GITHUB_WORKSPACE/dist/store"
        cp "$RUNNER_TEMP"/export-tv/*.ipa "$GITHUB_WORKSPACE/dist/store/diapason-${{ steps.version.outputs.version }}_tvos-store.ipa"

    - uses: actions/upload-artifact@v6
      if: steps.appstore_ipa.outcome == 'success'
      with:
        name: store-tvos-ipa
        path: dist/store/*.ipa
        retention-days: 14
        compression-level: 0

  build-linux:
    needs: version
    name: Build for Linux (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-latest
            flutter_dir: x64
            ld_arch: x86_64
            # Prebuilt ARM Linux Flutter SDKs are not published on stable, so the
            # aarch64 runner builds from the master channel; x64 stays on stable.
            flutter_channel: stable
          - arch: aarch64
            runner: ubuntu-24.04-arm
            flutter_dir: arm64
            ld_arch: aarch64
            flutter_channel: master
    steps:
    - uses: actions/checkout@v6
    - name: Apply release version
      id: version
      env:
        VERSION: ${{ needs.version.outputs.version }}
      run: |
        set -eu
        BUILD=$(grep '^version:' pubspec.yaml | sed 's/version:[[:space:]]*//' | cut -s -d+ -f2)
        if [ -n "$BUILD" ]; then NEW="$VERSION+$BUILD"; else NEW="$VERSION"; fi
        perl -pi -e "s/^version:.*/version: $NEW/" pubspec.yaml
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"

    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libmpv-dev mpv libpipewire-0.3-dev

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: ${{ matrix.flutter_channel }}
        cache: false
        pub-cache: true

    - name: Cache Dart build cache
      uses: actions/cache@v5
      with:
        path: |
          .dart_tool
          build
        key: ${{ runner.os }}-linux-${{ matrix.arch }}-dart-build-${{ hashFiles('pubspec.lock') }}
        restore-keys: ${{ runner.os }}-linux-${{ matrix.arch }}-dart-build-

    - run: flutter doctor
    - run: flutter pub get
    - run: flutter build linux --release --no-pub

    - name: Package build
      run: tar -czf "diapason-${{ steps.version.outputs.version }}_linux_${{ matrix.arch }}.tar.gz" -C build/linux/${{ matrix.flutter_dir }}/release/bundle .

    - uses: actions/upload-artifact@v6
      with:
        name: diapason-linux-${{ matrix.arch }}
        path: diapason-${{ steps.version.outputs.version }}_linux_${{ matrix.arch }}.tar.gz
        compression-level: 0

    # fpm builds both deb and rpm from one staging tree; rpm/rpmbuild is needed
    # for the rpm target, and linuxdeploy assembles the AppImage.
    - name: Install packaging tools
      run: |
        sudo apt-get install -y rpm ruby ruby-dev
        sudo gem install --no-document fpm
        curl -sSLo linuxdeploy.AppImage \
          https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-${{ matrix.ld_arch }}.AppImage
        chmod +x linuxdeploy.AppImage

    - name: Build deb / rpm / AppImage
      run: linux/packaging/build-packages.sh

    - uses: actions/upload-artifact@v6
      with:
        name: diapason-linux-packages-${{ matrix.arch }}
        path: build/linux/packages/*
        compression-level: 0

  # Flatpak and Snap build in containers that need their own toolchain and are
  # the least reliable jobs here, so they are opt-in and never gate a release.
  build-flatpak:
    needs: version
    name: Build Flatpak
    if: inputs.build_extras
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08
      options: --privileged
    steps:
    - uses: actions/checkout@v6

    - name: Install build dependencies
      run: |
        # jq is required by subosito/flutter-action's setup script. xz-devel is
        # the Fedora liblzma (lzma-sdk-devel is the unrelated 7-Zip SDK), and
        # pkgconf-pkg-config is needed for CMake's GTK lookup. gcc/rust are for
        # flutter_discord_rpc's cargokit build, which the GitHub runner image
        # provides preinstalled but this container does not.
        dnf install -y ninja-build cmake clang gcc gtk3-devel xz-devel pkgconf-pkg-config \
          mpv-libs-devel pipewire-devel curl git unzip xz which jq rust cargo python3

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'
        cache: false
        pub-cache: true

    # Flutter can't build inside the flatpak sandbox (no network for pub get, no
    # Flutter SDK extension), so the bundle is built here and the manifest just
    # installs the staged tree.
    - name: Build Flutter bundle
      run: |
        git config --global --add safe.directory '*'
        flutter doctor
        flutter pub get
        # flutter hides the underlying ninja failure, so re-run ninja verbosely
        # to surface the actual compiler/cargokit error before giving up.
        flutter build linux --release --no-pub --verbose || {
          echo "=== flutter build failed; re-running ninja for the real error ==="
          ninja -C build/linux/x64/release -v || true
          exit 1
        }

    # The Flathub manifest packages the published release tarballs; swap its
    # BUNDLE block for the bundle just built so this job tests the new code.
    - name: Stage bundle for the manifest
      run: |
        mkdir -p flatpak/staging
        cp -r build/linux/*/release/bundle flatpak/staging/
        python3 - <<'EOF'
        import pathlib, re
        path = pathlib.Path("flatpak/fr.nytuo.diapason.yml")
        text = re.sub(
            r"^([ \t]*)# BUNDLE-BEGIN.*?^[ \t]*# BUNDLE-END[^\n]*\n",
            lambda m: f"{m.group(1)}- type: dir\n{m.group(1)}  path: staging/bundle\n",
            path.read_text(),
            flags=re.M | re.S,
        )
        path.write_text(text)
        EOF

    - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
      with:
        bundle: diapason.flatpak
        manifest-path: flatpak/fr.nytuo.diapason.yml
        cache-key: flatpak-builder-${{ github.sha }}

  build-snap:
    needs: version
    name: Build Snap
    if: inputs.build_extras
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - uses: snapcore/action-build@v1
      id: snapcraft

    - uses: actions/upload-artifact@v6
      with:
        name: diapason-snap
        path: ${{ steps.snapcraft.outputs.snap }}
        compression-level: 0

  build-windows:
    needs: version
    name: Build for Windows (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
            flutter_dir: x64
            wix_arch: x64
            flutter_channel: stable
          - arch: aarch64
            runner: windows-11-arm
            flutter_dir: arm64
            wix_arch: arm64
            flutter_channel: master
    steps:
    - uses: actions/checkout@v6

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: ${{ matrix.flutter_channel }}
        cache: false
        pub-cache: true

    - name: Read app version
      id: version
      shell: pwsh
      run: |
        $line = (Select-String -Path pubspec.yaml -Pattern '^version:' | Select-Object -First 1).Line
        $v = ($line -replace 'version:\s*', '' -replace '\+.*', '').Trim()
        "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

    - name: Cache Dart build cache
      uses: actions/cache@v5
      with:
        path: |
          .dart_tool
          build
        key: ${{ runner.os }}-windows-${{ matrix.arch }}-dart-build-${{ hashFiles('pubspec.lock') }}
        restore-keys: ${{ runner.os }}-windows-${{ matrix.arch }}-dart-build-

    - run: flutter doctor
    - run: flutter pub get
    - run: flutter build windows --release --no-pub

    - name: Prepare installer output dir
      shell: pwsh
      run: New-Item -ItemType Directory -Force -Path installers | Out-Null

    - name: Package portable zip
      shell: pwsh
      run: |
        $base = "diapason-${{ steps.version.outputs.version }}_win_${{ matrix.arch }}"
        Compress-Archive -Path "build/windows/${{ matrix.flutter_dir }}/runner/Release/*" -DestinationPath "installers/$base.zip"

    # .exe installer via Inno Setup (6.3+ for the arm64 identifiers).
    - name: Build .exe installer (Inno Setup)
      shell: pwsh
      run: |
        choco install innosetup -y --no-progress
        $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
        $base = "diapason-${{ steps.version.outputs.version }}_win_${{ matrix.arch }}"
        & "$iscc" `
          "/DMyAppVersion=${{ steps.version.outputs.version }}" `
          "/DMyArch=${{ matrix.arch }}" `
          "/DMySourceDir=$(Resolve-Path "build\windows\${{ matrix.flutter_dir }}\runner\Release")" `
          "/DMyOutputDir=$(Resolve-Path installers)" `
          "/DMyOutputBaseFilename=$base" `
          "windows\packaging\diapason.iss"

    # .msi installer via WiX v5. Harvests the whole bundle dir with <Files>.
    - name: Build .msi installer (WiX)
      shell: pwsh
      run: |
        dotnet tool install --global wix --version 5.*
        $wix = "$env:USERPROFILE\.dotnet\tools\wix.exe"
        $base = "diapason-${{ steps.version.outputs.version }}_win_${{ matrix.arch }}"
        & "$wix" build `
          -arch ${{ matrix.wix_arch }} `
          -d Version="${{ steps.version.outputs.version }}" `
          -d SourceDir="build\windows\${{ matrix.flutter_dir }}\runner\Release" `
          -o "installers\$base.msi" `
          "windows\packaging\diapason.wxs"

    - uses: actions/upload-artifact@v6
      with:
        name: diapason-windows-${{ matrix.arch }}
        path: installers/*
        compression-level: 0

  build-macos:
    needs: version
    name: Build for macOS
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v6

    - uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'
        cache: false
        pub-cache: true

    - name: Apply release version
      id: version
      env:
        VERSION: ${{ needs.version.outputs.version }}
      run: |
        set -eu
        BUILD=$(grep '^version:' pubspec.yaml | sed 's/version:[[:space:]]*//' | cut -s -d+ -f2)
        if [ -n "$BUILD" ]; then NEW="$VERSION+$BUILD"; else NEW="$VERSION"; fi
        perl -pi -e "s/^version:.*/version: $NEW/" pubspec.yaml
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"

    - name: Cache CocoaPods
      uses: actions/cache@v5
      with:
        path: |
          macos/Pods
          ~/.cocoapods
        key: ${{ runner.os }}-macos-pods-${{ hashFiles('macos/Podfile.lock') }}
        restore-keys: ${{ runner.os }}-macos-pods-

    - name: Cache Dart build cache
      uses: actions/cache@v5
      with:
        path: |
          .dart_tool
          build
        key: ${{ runner.os }}-macos-dart-build-${{ hashFiles('pubspec.lock') }}
        restore-keys: ${{ runner.os }}-macos-dart-build-

    - run: flutter doctor
    - run: flutter pub get
    - run: flutter build macos --release --no-pub

    # macos-latest is an Apple-silicon runner, so the produced app is aarch64.
    - name: Package build
      env:
        VERSION: ${{ steps.version.outputs.version }}
      run: |
        BASE="diapason-${VERSION}_macos_aarch64"
        cd build/macos/Build/Products/Release
        zip -r -y "$GITHUB_WORKSPACE/${BASE}.zip" Diapason.app
        mkdir -p "$GITHUB_WORKSPACE/dmg-staging"
        cp -r Diapason.app "$GITHUB_WORKSPACE/dmg-staging/"
        ln -s /Applications "$GITHUB_WORKSPACE/dmg-staging/Applications"
        hdiutil create -volname Diapason -srcfolder "$GITHUB_WORKSPACE/dmg-staging" \
          -ov -format UDZO "$GITHUB_WORKSPACE/${BASE}.dmg"
        pkgbuild --identifier fr.nytuo.diapason --version "$VERSION" \
          --install-location /Applications --component Diapason.app \
          "$GITHUB_WORKSPACE/${BASE}.pkg"

    - uses: actions/upload-artifact@v6
      with:
        name: diapason-macos
        path: |
          diapason-${{ steps.version.outputs.version }}_macos_aarch64.zip
          diapason-${{ steps.version.outputs.version }}_macos_aarch64.dmg
          diapason-${{ steps.version.outputs.version }}_macos_aarch64.pkg
        compression-level: 0

  google-play:
    name: Upload to Google Play
    needs: [version, mobile-plan, build-android]
    if: ${{ !cancelled() && needs.mobile-plan.outputs.publish_android == 'true' && needs.build-android.result == 'success' }}
    runs-on: ubuntu-latest
    environment: app-stores
    permissions:
      contents: read
    steps:
    - uses: actions/download-artifact@v6
      with:
        name: store-android-aab
        path: aab

    # The Play Console rejects "completed" releases on an app that never had
    # one, and a production release should not go out unattended: production
    # is therefore left as a draft to send for review from the Play Console.
    - uses: r0adkll/upload-google-play@v1
      with:
        serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        packageName: fr.nytuo.diapason
        releaseFiles: aab/*.aab
        releaseName: ${{ needs.version.outputs.tag }}
        track: ${{ inputs.play_track }}
        status: ${{ inputs.play_track == 'production' && 'draft' || 'completed' }}

  app-store:
    name: Upload to App Store Connect
    needs: [mobile-plan, build-ios]
    if: ${{ !cancelled() && needs.mobile-plan.outputs.publish_ios == 'true' && needs.build-ios.result == 'success' }}
    runs-on: macos-latest
    environment: app-stores
    permissions:
      contents: read
    steps:
    - uses: actions/download-artifact@v6
      with:
        name: store-ios-ipa
        path: ipa

    - name: Upload build
      env:
        APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
      run: |
        set -euo pipefail
        KEY_DIR="$HOME/.appstoreconnect/private_keys"
        mkdir -p "$KEY_DIR"
        printf '%s\n' "$APPLE_API_KEY_P8" > "$KEY_DIR/AuthKey_${APPLE_API_KEY}.p8"
        xcrun altool --upload-app --type ios --file ipa/*.ipa \
          --apiKey "$APPLE_API_KEY" --apiIssuer "$APPLE_API_ISSUER"

  app-store-tvos:
    name: Upload tvOS to App Store Connect
    needs: [mobile-plan, build-tvos]
    if: ${{ !cancelled() && needs.mobile-plan.outputs.publish_tvos == 'true' && needs.build-tvos.result == 'success' }}
    runs-on: macos-latest
    environment: app-stores
    permissions:
      contents: read
    steps:
    - uses: actions/download-artifact@v6
      with:
        name: store-tvos-ipa
        path: ipa

    # Same bundle ID as the iOS app, so this lands on the same App Store
    # Connect app record once its tvOS platform has been added there.
    - name: Upload build
      env:
        APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
      run: |
        set -euo pipefail
        KEY_DIR="$HOME/.appstoreconnect/private_keys"
        mkdir -p "$KEY_DIR"
        printf '%s\n' "$APPLE_API_KEY_P8" > "$KEY_DIR/AuthKey_${APPLE_API_KEY}.p8"
        xcrun altool --upload-app --type appletvos --file ipa/*.ipa \
          --apiKey "$APPLE_API_KEY" --apiIssuer "$APPLE_API_ISSUER"

  release:
    name: Create release
    needs:
      - version
      - build-android
      - build-ios
      - build-tvos
      - build-linux
      - build-windows
      - build-macos
    # build-tvos is skipped when the "build_tvos" input is off; any other skipped
    # or failed build still stops the release.
    if: >-
      ${{ !cancelled()
      && needs.version.result == 'success'
      && needs.build-android.result == 'success'
      && needs.build-ios.result == 'success'
      && (needs.build-tvos.result == 'success' || needs.build-tvos.result == 'skipped')
      && needs.build-linux.result == 'success'
      && needs.build-windows.result == 'success'
      && needs.build-macos.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v6

    - name: Write changelog
      run: |
        cat > "$RUNNER_TEMP/notes.md" <<'__NOTES__'
        ${{ needs.version.outputs.changelog }}
        __NOTES__

    - name: Download build artifacts
      uses: actions/download-artifact@v6
      with:
        path: artifacts

    - name: Collect release assets
      run: |
        set -eux
        # A dedicated directory, not "assets" — the repo checkout already has
        # an assets/ dir (app assets, e.g. assets/icon/) that "assets/*" would
        # also glob, and gh release upload chokes on directory entries.
        mkdir -p release-assets
        # Every job now uploads already-named, single-file assets following the
        # diapason-<version>_<os>_<arch>.<ext> scheme, so just gather them by
        # extension.
        find artifacts -type f \
          \( -name '*.apk' -o -name '*.tar.gz' -o -name '*.deb' -o -name '*.rpm' \
             -o -name '*.AppImage' -o -name '*.zip' -o -name '*.snap' -o -name '*.flatpak' \
             -o -name '*.ipa' -o -name '*.dmg' -o -name '*.exe' -o -name '*.msi' \
             -o -name '*.pkg' \) \
          -exec cp {} release-assets/ \;
        ls -lh release-assets

    - name: Create release
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ needs.version.outputs.tag }}
      run: |
        gh release create "$TAG" \
          --repo "${{ github.repository }}" \
          --target "${{ github.sha }}" \
          --title "$TAG" \
          --notes-file "$RUNNER_TEMP/notes.md" \
          --draft \
          ${{ inputs.prerelease && '--prerelease' || '' }} \
          release-assets/*
