allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

def rootBuildDir = rootProject.layout.buildDirectory.get().dir('../../build')
rootProject.layout.buildDirectory.value(rootBuildDir)
subprojects {
    def subProjectBuildDir = rootBuildDir.dir(project.name)
    project.layout.buildDirectory.value(subProjectBuildDir)
}
subprojects {
    afterEvaluate { project ->
        if (project.plugins.hasPlugin("com.android.application") ||
                project.plugins.hasPlugin("com.android.library")) {
            project.android {
                // Plugins may need a newer SDK than Flutter's default (permission_handler_android
                // 14.x uses Android 17 symbols); never go below what Flutter asks for.
                compileSdkVersion Math.max(flutter.compileSdkVersion as int, 37)
                buildToolsVersion "36.0.0"
            }
        }
    }
}
subprojects {
    project.evaluationDependsOn(':app')
}

tasks.register("clean", Delete) {
    delete rootProject.layout.buildDirectory
}
