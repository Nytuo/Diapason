name: release

# Manual only.
#
#   1. version  — derive the next semver from the conventional commits since
#                 the last v* tag, or take the explicit override input.
#   2. build    — build.yml: every platform with that version patched into the
#                 manifests (workspace only) plus the tests. If a build run of
#                 build.yml already succeeded on this exact commit and version,
#                 its artifacts are reused instead of rebuilding; tick
#                 "force_build" to rebuild anyway.
#   3. release  — a DRAFT GitHub release tagged v<version>, changelog as the
#                 body, artifacts attached.
#
# Mobile and TV targets: Android (phone + Android TV, one app bundle), iOS and
# tvOS. With "publish_stores" the Android bundle goes to Google Play (the
# Android TV form factor is enabled in the Play Console, see
# .github/MOBILE_RELEASE.md) and the iOS and tvOS builds go to App Store
# Connect. Store uploads never submit for review.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump — 'auto' derives it from conventional commits"
        type: choice
        default: auto
        options:
          - auto
          - patch
          - minor
          - major
      version:
        description: 'Explicit version, e.g. 1.4.0 (overrides "bump")'
        type: string
        required: false
      prerelease:
        description: 'Mark the release as a prerelease'
        type: boolean
        default: false
      run_integration_tests:
        description: 'Run the emulator integration tests'
        type: boolean
        default: false
      build_extras:
        description: 'Also build Snap and Flatpak'
        type: boolean
        default: true
      build_tvos:
        description: 'Build the tvOS app (needs the flutter-tvos toolchain)'
        type: boolean
        default: true
      force_build:
        description: 'Rebuild everything even if a matching successful build run exists'
        type: boolean
        default: false
      publish_stores:
        description: 'Also upload to Google Play (phone + Android TV) and App Store Connect (iOS + tvOS)'
        type: boolean
        default: false
      play_track:
        description: 'Google Play track used when publishing'
        type: choice
        default: internal
        options:
          - internal
          - alpha
          - beta
          - production


# Desktop builds are unsigned: they are for testing and for the auto-updater's
# release assets, not for store distribution.
jobs:
  version:
    name: Resolve version
    uses: ./.github/workflows/version.yml
    with:
      bump: ${{ inputs.bump }}
      version: ${{ inputs.version || '' }}
      strict: true

  mobile-plan:
    name: Plan store uploads
    runs-on: ubuntu-latest
    outputs:
      publish_android: ${{ steps.plan.outputs.publish_android }}
      publish_ios: ${{ steps.plan.outputs.publish_ios }}
      publish_tvos: ${{ steps.plan.outputs.publish_tvos }}
    steps:
      - name: Check store secrets
        id: plan
        shell: bash
        env:
          PUBLISH: ${{ inputs.publish_stores }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_DISTRIBUTION_CERT_P12_BASE64: ${{ secrets.APPLE_DISTRIBUTION_CERT_P12_BASE64 }}
          APPLE_DISTRIBUTION_CERT_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_CERT_PASSWORD }}
          BUILD_TVOS: ${{ inputs.build_tvos }}
        run: |
          set -euo pipefail

          if [ "$PUBLISH" != "true" ]; then
            {
              echo "publish_android=false"
              echo "publish_ios=false"
              echo "publish_tvos=false"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          missing() {
            local out=() name
            for name in "$@"; do
              [ -n "${!name:-}" ] || out+=("$name")
            done
            echo "${out[*]:-}"
          }

          # The keystore password is optional: a keystore may have none, and GitHub cannot store an empty secret.
          ANDROID_GONE=$(missing ANDROID_KEYSTORE_BASE64 ANDROID_KEY_ALIAS PLAY_SERVICE_ACCOUNT_JSON)
          IOS_GONE=$(missing APPLE_API_ISSUER APPLE_API_KEY APPLE_API_KEY_P8 APPLE_DISTRIBUTION_CERT_P12_BASE64 APPLE_DISTRIBUTION_CERT_PASSWORD)
          TVOS_GONE=$(missing APPLE_API_ISSUER APPLE_API_KEY APPLE_API_KEY_P8 APPLE_DISTRIBUTION_CERT_P12_BASE64 APPLE_DISTRIBUTION_CERT_PASSWORD)
          [ "$BUILD_TVOS" = "true" ] || TVOS_GONE="tvOS build disabled"

          [ -n "$ANDROID_GONE" ] && echo "::warning::Google Play upload skipped, missing secrets: ${ANDROID_GONE}"
          [ -n "$IOS_GONE" ] && echo "::warning::App Store Connect upload (iOS) skipped, missing secrets: ${IOS_GONE}"
          [ -n "$TVOS_GONE" ] && echo "::warning::App Store Connect upload (tvOS) skipped: ${TVOS_GONE}"

          if [ -n "$ANDROID_GONE" ] && [ -n "$IOS_GONE" ] && [ -n "$TVOS_GONE" ]; then
            echo "::error::publish_stores is ticked but no store secrets are configured for any platform."
            exit 1
          fi

          {
            echo "publish_android=$([ -z "$ANDROID_GONE" ] && echo true || echo false)"
            echo "publish_ios=$([ -z "$IOS_GONE" ] && echo true || echo false)"
            echo "publish_tvos=$([ -z "$TVOS_GONE" ] && echo true || echo false)"
          } >> "$GITHUB_OUTPUT"


  # Look for an earlier successful build.yml run on this commit that built the
  # same version. The signed store IPAs are never reused: they are built
  # by the `stores` job below with this run's (ever-growing) build number.
  find-build:
    name: Look for a reusable build
    needs: version
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      reuse: ${{ steps.find.outputs.reuse }}
      run_id: ${{ steps.find.outputs.run_id }}
    steps:
    - name: Find a matching build run
      id: find
      env:
        GH_TOKEN: ${{ github.token }}
        VERSION: ${{ needs.version.outputs.version }}
        FORCE: ${{ inputs.force_build }}
      run: |
        set -uo pipefail
        echo "reuse=false" >> "$GITHUB_OUTPUT"
        if [ "$FORCE" = "true" ]; then
          echo "force_build is set: rebuilding."
          exit 0
        fi
        IDS=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow build.yml \
          --commit "$GITHUB_SHA" --status success --limit 20 \
          --json databaseId --jq '.[].databaseId')
        for ID in $IDS; do
          D=$(mktemp -d)
          gh run download "$ID" --repo "$GITHUB_REPOSITORY" -n build-meta -D "$D" 2>/dev/null || continue
          V=$(jq -r .version "$D/build-meta.json")
          if [ "$V" != "$VERSION" ]; then continue; fi
          echo "Reusing the artifacts of build run $ID (version $V)."
          echo "reuse=true" >> "$GITHUB_OUTPUT"
          echo "run_id=$ID" >> "$GITHUB_OUTPUT"
          echo "### Reusing build run [$ID](https://github.com/$GITHUB_REPOSITORY/actions/runs/$ID)" >> "$GITHUB_STEP_SUMMARY"
          exit 0
        done
        echo "No reusable build run for $GITHUB_SHA at version $VERSION: building."

  build:
    name: Build
    needs: [version, find-build]
    if: needs.find-build.outputs.reuse != 'true'
    uses: ./.github/workflows/build.yml
    secrets: inherit
    with:
      version: ${{ needs.version.outputs.version }}
      run_integration_tests: ${{ inputs.run_integration_tests }}
      build_extras: ${{ inputs.build_extras }}
      build_tvos: ${{ inputs.build_tvos }}

  # Signed App Store builds, always fresh (they need the Apple secrets and a
  # new build number); everything else comes from `build` or a reused run.
  stores:
    name: Signed store builds
    needs: [version, mobile-plan]
    if: ${{ needs.mobile-plan.outputs.publish_ios == 'true' || needs.mobile-plan.outputs.publish_tvos == 'true' }}
    uses: ./.github/workflows/store-builds.yml
    secrets: inherit
    with:
      version: ${{ needs.version.outputs.version }}
      build_ios: ${{ needs.mobile-plan.outputs.publish_ios == 'true' }}
      build_tvos: ${{ needs.mobile-plan.outputs.publish_tvos == 'true' }}

  google-play:
    name: Upload to Google Play
    needs: [version, mobile-plan, find-build, build]
    if: ${{ !cancelled() && needs.mobile-plan.outputs.publish_android == 'true' && (needs.build.result == 'success' || needs.build.result == 'skipped') }}
    runs-on: ubuntu-latest
    environment: app-stores
    permissions:
      contents: read
    steps:
    - uses: actions/download-artifact@v6
      with:
        name: store-android-aab
        run-id: ${{ needs.find-build.outputs.run_id || github.run_id }}
        github-token: ${{ github.token }}
        path: aab

    # The Play Console rejects "completed" releases on an app that never had
    # one, and a production release should not go out unattended: production
    # is therefore left as a draft to send for review from the Play Console.
    - uses: r0adkll/upload-google-play@v1
      with:
        serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        packageName: fr.nytuo.diapason
        releaseFiles: aab/*.aab
        releaseName: ${{ needs.version.outputs.tag }}
        track: ${{ inputs.play_track }}
        status: ${{ inputs.play_track == 'production' && 'draft' || 'completed' }}

  app-store:
    name: Upload to App Store Connect
    needs: [mobile-plan, stores]
    if: ${{ !cancelled() && needs.mobile-plan.outputs.publish_ios == 'true' && needs.stores.result == 'success' }}
    runs-on: macos-latest
    environment: app-stores
    permissions:
      contents: read
    steps:
    - uses: actions/download-artifact@v6
      with:
        name: store-ios-ipa
        path: ipa

    - name: Upload build
      env:
        APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
      run: |
        set -euo pipefail
        KEY_DIR="$HOME/.appstoreconnect/private_keys"
        mkdir -p "$KEY_DIR"
        printf '%s\n' "$APPLE_API_KEY_P8" > "$KEY_DIR/AuthKey_${APPLE_API_KEY}.p8"
        xcrun altool --upload-app --type ios --file ipa/*.ipa \
          --apiKey "$APPLE_API_KEY" --apiIssuer "$APPLE_API_ISSUER"

  app-store-tvos:
    name: Upload tvOS to App Store Connect
    needs: [mobile-plan, stores]
    if: ${{ !cancelled() && needs.mobile-plan.outputs.publish_tvos == 'true' && needs.stores.result == 'success' }}
    runs-on: macos-latest
    environment: app-stores
    permissions:
      contents: read
    steps:
    - uses: actions/download-artifact@v6
      with:
        name: store-tvos-ipa
        path: ipa

    # Same bundle ID as the iOS app, so this lands on the same App Store
    # Connect app record once its tvOS platform has been added there.
    - name: Upload build
      env:
        APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
      run: |
        set -euo pipefail
        KEY_DIR="$HOME/.appstoreconnect/private_keys"
        mkdir -p "$KEY_DIR"
        printf '%s\n' "$APPLE_API_KEY_P8" > "$KEY_DIR/AuthKey_${APPLE_API_KEY}.p8"
        xcrun altool --upload-app --type appletvos --file ipa/*.ipa \
          --apiKey "$APPLE_API_KEY" --apiIssuer "$APPLE_API_ISSUER"

  release:
    name: Create release
    needs: [version, find-build, build]
    # build-tvos is skipped when the "build_tvos" input is off; any other skipped
    # or failed build still stops the release.
    if: >-
      ${{ !cancelled()
      && needs.version.result == 'success'
      && (needs.build.result == 'success' || needs.build.result == 'skipped')
      && (needs.build.result == 'success' || needs.find-build.outputs.reuse == 'true') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
    - uses: actions/checkout@v6

    - name: Write changelog
      run: |
        cat > "$RUNNER_TEMP/notes.md" <<'__NOTES__'
        ${{ needs.version.outputs.changelog }}
        __NOTES__

    - name: Download build artifacts
      uses: actions/download-artifact@v6
      with:
        path: artifacts
        run-id: ${{ needs.find-build.outputs.run_id || github.run_id }}
        github-token: ${{ github.token }}

    - name: Collect release assets
      run: |
        set -eux
        # A dedicated directory, not "assets" — the repo checkout already has
        # an assets/ dir (app assets, e.g. assets/icon/) that "assets/*" would
        # also glob, and gh release upload chokes on directory entries.
        mkdir -p release-assets
        # Every job now uploads already-named, single-file assets following the
        # diapason-<version>_<os>_<arch>.<ext> scheme, so just gather them by
        # extension.
        find artifacts -type f \
          \( -name '*.apk' -o -name '*.tar.gz' -o -name '*.deb' -o -name '*.rpm' \
             -o -name '*.AppImage' -o -name '*.zip' -o -name '*.snap' -o -name '*.flatpak' \
             -o -name '*.ipa' -o -name '*.dmg' -o -name '*.exe' -o -name '*.msi' \
             -o -name '*.pkg' \) \
          -exec cp {} release-assets/ \;
        ls -lh release-assets

    - name: Create release
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ needs.version.outputs.tag }}
      run: |
        gh release create "$TAG" \
          --repo "${{ github.repository }}" \
          --target "${{ github.sha }}" \
          --title "$TAG" \
          --notes-file "$RUNNER_TEMP/notes.md" \
          --draft \
          ${{ inputs.prerelease && '--prerelease' || '' }} \
          release-assets/*
